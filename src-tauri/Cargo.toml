[package]
name = "copet"
version = "1.0.0"
description = "Co-pet desktop pet inbox"
edition = "2021"

[lib]
name = "copet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
calamine = "0.36"
chrono = { version = "0.4", features = ["serde"] }
dom_smoothie = "0.18"
enigo = "0.6"
getrandom = "0.3"
hex = "0.4.3"
htmd = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
infer = "0.22"
pdf-extract = "0.12"
percent-encoding = "2"
quick-xml = "0.41"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "multipart", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
scraper = "0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
sysinfo = "0.39"
# `macos-private-api` must sit here: tauri-build matches it against `app.macOSPrivateApi` in
# `[dependencies]` only. It does nothing on Windows.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
thiserror = "2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "process", "fs", "macros", "signal", "net", "io-util"] }
unicode-normalization = "0.1"
url = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v7", "v4"] }
toml_edit = "0.25.17"
hkdf = "0.13"
hmac = "0.13"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
cpal = "0.18.2"
hound = "3.5.1"
whisper-rs = { version = "0.16", features = ["raw-api"] }
sherpa-onnx = "1.13"
symphonia = { version = "0.6.1", features = ["aac", "alac", "isomp4", "mp3", "flac", "wav", "pcm", "ogg", "vorbis", "aiff"] }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-vision = "0.3"
security-framework = "3.7.0"
tauri-nspanel = "2.1"
block2 = "0.6"
screencapturekit = { version = "8", features = ["macos_13_0"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "EKEventStore", "EKEvent", "EKCalendar", "EKCalendarItem", "EKObject", "EKParticipant", "EKSource", "EKTypes"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
  "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory",
  "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation",
  "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
  "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams",
] }
windows-core = "0.62"

# whisper.cpp built as Debug is unusably slow in `tauri dev`.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile = "3.27.0"

# Every crates.io release of `zip` except 9.0.3 is yanked; calamine 0.36 needs ^8.6.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v8.6.0" }
